# promtool test rules alerts.test.yml
rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  # The support agent fails 3 runs in 13 (23%), the planner 1 in 101: only the support agent pages.
  - interval: 1m
    input_series:
      - series: 'gen_ai_invoke_agent_duration_seconds_count{gen_ai_agent_name="support", gen_ai_operation_name="invoke_agent"}'
        values: '0+10x40'
      - series: 'gen_ai_invoke_agent_duration_seconds_count{gen_ai_agent_name="support", gen_ai_operation_name="invoke_agent", error_type="TimeoutError"}'
        values: '0+3x40'
      - series: 'gen_ai_invoke_agent_duration_seconds_count{gen_ai_agent_name="planner", gen_ai_operation_name="invoke_agent"}'
        values: '0+100x40'
      - series: 'gen_ai_invoke_agent_duration_seconds_count{gen_ai_agent_name="planner", gen_ai_operation_name="invoke_agent", error_type="RuntimeError"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 3m  # failing, but not for 5 minutes yet
        alertname: AgentRunsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: AgentRunsFailing
        exp_alerts:
          - exp_labels: {severity: page, gen_ai_agent_name: support}
            exp_annotations: {summary: "support: 23.08% of runs are failing"}

  # A model whose calls start failing pages; an agent with no errors at all stays quiet (no error series).
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="example", gen_ai_request_model="small", gen_ai_operation_name="chat"}'
        values: '0+20x40'
      - series: 'gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="example", gen_ai_request_model="small", gen_ai_operation_name="chat", error_type="RateLimitError"}'
        values: '0x10 0+5x30'
      - series: 'gen_ai_invoke_agent_duration_seconds_count{gen_ai_agent_name="calm", gen_ai_operation_name="invoke_agent"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 8m  # no errors yet
        alertname: ModelCallsFailing
        exp_alerts: []
      - eval_time: 35m
        alertname: ModelCallsFailing
        exp_alerts:
          - exp_labels: {severity: page, gen_ai_provider_name: example, gen_ai_request_model: small}
            exp_annotations: {summary: "small: 20% of calls are failing"}
      - eval_time: 35m
        alertname: AgentRunsFailing
        exp_alerts: []

  # search answers within 8 s, slow_report takes 20 s: only slow_report gets a ticket.
  - interval: 1m
    input_series:
      - series: 'gen_ai_execute_tool_duration_seconds_bucket{gen_ai_tool_name="search", le="5.12"}'
        values: '0+90x40'
      - series: 'gen_ai_execute_tool_duration_seconds_bucket{gen_ai_tool_name="search", le="10.24"}'
        values: '0+100x40'
      - series: 'gen_ai_execute_tool_duration_seconds_bucket{gen_ai_tool_name="search", le="+Inf"}'
        values: '0+100x40'
      - series: 'gen_ai_execute_tool_duration_seconds_bucket{gen_ai_tool_name="slow_report", le="10.24"}'
        values: '0x40'
      - series: 'gen_ai_execute_tool_duration_seconds_bucket{gen_ai_tool_name="slow_report", le="20.48"}'
        values: '0+4x40'
      - series: 'gen_ai_execute_tool_duration_seconds_bucket{gen_ai_tool_name="slow_report", le="+Inf"}'
        values: '0+4x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: ToolCallsSlow
        exp_alerts:
          - exp_labels: {severity: ticket, gen_ai_tool_name: slow_report}
            exp_annotations: {summary: "slow_report: p95 is 19.97s"}

  # 0.05 a minute is 3 an hour: under budget. Then 0.2 a minute: 12 an hour, over.
  - interval: 1m
    input_series:
      - series: 'agent_otel_cost_total{gen_ai_request_model="large", agent_otel_cost_currency="USD"}'
        values: '0+0.05x60 3+0.2x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: SpendAboveBudget
        exp_alerts: []
      - eval_time: 120m
        alertname: SpendAboveBudget
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations: {summary: "12.00 spent on model calls in the last hour"}

  # One unpriced call is enough for a ticket naming the model.
  - interval: 1m
    input_series:
      - series: 'agent_otel_unpriced_calls_total{gen_ai_request_model="new-model", gen_ai_provider_name="example"}'
        values: '0x5 1x55'
    alert_rule_test:
      - eval_time: 3m
        alertname: ModelCallsUnpriced
        exp_alerts: []
      - eval_time: 30m
        alertname: ModelCallsUnpriced
        exp_alerts:
          - exp_labels: {severity: ticket, gen_ai_request_model: new-model}
            exp_annotations: {summary: "new-model is not in the price table, so cost totals are low"}

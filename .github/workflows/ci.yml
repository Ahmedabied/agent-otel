name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
        otel: [""]
        include:
          - python: "3.10"
            otel: "1.30.0"  # the lowest OpenTelemetry pyproject.toml allows
    name: test (${{ matrix.python }}${{ matrix.otel && format(', otel {0}', matrix.otel) || '' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - if: matrix.otel
        run: python -m pip install "opentelemetry-api==${{ matrix.otel }}" "opentelemetry-sdk==${{ matrix.otel }}"
      - run: python -c "import opentelemetry.version as v; print('opentelemetry', v.__version__)"
      - run: pytest -q
      - name: Demo run and viewer
        run: |
          python examples/demo_agent.py
          agent-otel summary runs/demo.jsonl
          agent-otel view runs/demo.jsonl -o runs/demo.html
      - name: Overhead benchmark (short)
        run: python bench/bench.py --calls 5000

  js:
    # The TypeScript side. Its JSON lines are read back by the Python CLI in the tests.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ..
      - run: npm ci
      - run: npm run typecheck
      - run: AGENT_OTEL_PYTHON=python npm test
      - name: Overhead benchmark
        run: node bench/overhead.ts

  jaeger:
    # The spans sent over OTLP to a real Jaeger, then read back from its API and checked.
    runs-on: ubuntu-latest
    env:
      JAEGER_VERSION: "2.23.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[otlp]'
      - name: Start Jaeger (release binary, checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$JAEGER_VERSION" -R jaegertracing/jaeger -D /tmp/jaeger \
            -p "jaeger-$JAEGER_VERSION-linux-amd64.tar.gz" -p "jaeger-$JAEGER_VERSION-linux-amd64.sha256sum.txt"
          cd /tmp/jaeger && tar -xzf "jaeger-$JAEGER_VERSION-linux-amd64.tar.gz"
          grep "/jaeger$" "jaeger-$JAEGER_VERSION-linux-amd64.sha256sum.txt" | sed 's/ \*/  /' | sha256sum -c -
          nohup "./jaeger-$JAEGER_VERSION-linux-amd64/jaeger" > jaeger.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:16686/ > /dev/null && break; sleep 1; done
      - run: python examples/otlp_jaeger.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The TypeScript side, same checks
        working-directory: js
        run: |
          npm ci
          node examples/otlp-jaeger.ts

  prometheus:
    # The metrics sent over OTLP to a real Prometheus, read back with PromQL and checked against the spans.
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: "3.16.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[otlp]'
      - name: Start Prometheus (release binary, checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$PROMETHEUS_VERSION" -R prometheus/prometheus -D /tmp/prom \
            -p "prometheus-$PROMETHEUS_VERSION.linux-amd64.tar.gz" -p sha256sums.txt
          cd /tmp/prom
          grep " prometheus-$PROMETHEUS_VERSION.linux-amd64.tar.gz$" sha256sums.txt | sha256sum -c -
          tar -xzf "prometheus-$PROMETHEUS_VERSION.linux-amd64.tar.gz"
          cd "prometheus-$PROMETHEUS_VERSION.linux-amd64"
          nohup ./prometheus --config.file=prometheus.yml --web.enable-otlp-receiver > /tmp/prom/prometheus.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9090/-/ready > /dev/null && break; sleep 1; done
      - name: Alert rules load and pass their unit tests
        working-directory: examples/prometheus
        run: |
          PROMTOOL="/tmp/prom/prometheus-$PROMETHEUS_VERSION.linux-amd64/promtool"
          "$PROMTOOL" check rules alerts.yml
          "$PROMTOOL" test rules alerts.test.yml
      - run: python examples/otlp_prometheus.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The TypeScript side, same checks
        working-directory: js
        run: |
          npm ci
          node examples/otlp-prometheus.ts
      - if: failure()
        run: cat /tmp/prom/prometheus.log
